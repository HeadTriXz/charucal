[project]
name = "charucal"
version = "0.1.2"
description = "A multi-camera calibration system using ChArUco boards to align and transform camera views into a single top-down perspective."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "HeadTriXz" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.3",
    "opencv-python>=4.13.0.92",
]
keywords = ["opencv", "top-down", "calibration", "distance-calculation", "multi-camera", "charuco", "bird-eye-view"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/HeadTriXz/charucal"
Documentation = "https://headtrixz.github.io/charucal"
Issues = "https://github.com/HeadTriXz/charucal/issues"

[project.scripts]
charucal = "charucal.__main__:main"

[dependency-groups]
dev = [
    "griffe-sphinx>=0.2.1",
    "mkdocstrings[python]>=1.0.3",
    "ruff>=0.15.6",
    "zensical>=0.0.31",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"
