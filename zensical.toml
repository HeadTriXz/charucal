[project]
site_name = "ChArUcal"
site_description = "A multi-camera calibration system using ChArUco boards to align and transform camera views into a single top-down perspective."
site_author = "Lars Knol"
repo_url = "https://github.com/HeadTriXz/charucal"
repo_name = "HeadTriXz/charucal"
copyright = "&copy; 2026 Lars Knol"

nav = [
    { "Home" = "index.md" },
    { "Getting Started" = [
        "getting-started/installation.md",
        "getting-started/quick-start.md",
        "getting-started/capture-tips.md"
    ] },
    { "How It Works" = "how-it-works.md" },
    { "CLI Reference" = [
        "cli/calibrate.md",
        "cli/preview.md"
    ] },
    { "API Reference" = [
        "api/index.md",
        "api/calibrate.md",
        "api/pattern.md",
        "api/transform.md",
        "api/grid.md"
    ] },
    { "Troubleshooting" = "troubleshooting.md" }
]

[project.theme]
name = "material"
features = [
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.sections",
    "navigation.expand",
    "navigation.path",
    "navigation.top",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "search.highlight",
    "search.suggest",
    "content.code.copy",
    "content.code.annotate",
    "toc.follow"
]

[[project.theme.palette]]
scheme = "default"
toggle = { icon = "material/brightness-7", name = "Switch to dark mode" }

[[project.theme.palette]]
scheme = "slate"
toggle = { icon = "material/brightness-4", name = "Switch to light mode" }

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python]
inventories = [
    "https://docs.python.org/3/objects.inv",
    "https://numpy.org/doc/stable/objects.inv",
]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "sphinx"
inherited_members = true
separate_signature = true
show_source = true
show_root_heading = true
show_root_full_path = false
show_signature_annotations = true
show_symbol_type_heading = true
show_symbol_type_toc = true
merge_init_into_class = true
members_order = "source"
filters = "public"
summary = true
extensions = ["griffe_sphinx"]
